upstream user_service         { server 127.0.0.1:8000; }
upstream project_service      { server 127.0.0.1:8001; }
upstream mastergraph_service  { server 127.0.0.1:8003; }
upstream navigation_service   { server 127.0.0.1:8009; }
upstream auth_service         { server 127.0.0.1:8010; }
upstream delegation_service   { server 127.0.0.1:8011; }
upstream notification_service { server 127.0.0.1:8012; }
upstream ui_composer_service  { server 127.0.0.1:8020; }

server {
    listen 8080;
    server_name localhost;

    access_log /var/log/nginx/gateway_access.log;
    error_log  /var/log/nginx/gateway_error.log;

    client_max_body_size 100M;

    location = /health {
        access_log off;
        return 200 "Gateway is healthy\n";
        add_header Content-Type text/plain;
    }

    location = /auth-check {
        internal;
        proxy_pass http://auth_service/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-URI $request_uri;

        proxy_cache auth_cache;
        proxy_cache_key "$http_authorization";
        proxy_cache_valid 200 60s;
        proxy_cache_valid 401 10s;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
    }

    # Публичные эндпоинты — напрямую в User Service
    location ~ ^/api/v1/auth/(login|refresh|reset-password|register)$ {
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /internal/* — только с localhost и локальной сети
    location /internal/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Плитки
    location /api/v1/navigation/ {
        auth_request /auth-check;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        auth_request_set $impersonated_by $upstream_http_x_impersonated_by;

        proxy_pass http://navigation_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-ID $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Impersonated-By $impersonated_by;
        proxy_set_header Authorization $http_authorization;
    }

    # Проекты
    location /api/v1/projects/ {
        auth_request /auth-check;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        auth_request_set $impersonated_by $upstream_http_x_impersonated_by;

        proxy_pass http://project_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-ID $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Impersonated-By $impersonated_by;
        proxy_set_header Authorization $http_authorization;
    }

    # Mastergraphics (пока не запущен)
    location /api/v1/mastergraphics/ {
        auth_request /auth-check;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        auth_request_set $impersonated_by $upstream_http_x_impersonated_by;

        proxy_pass http://mastergraph_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-ID $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Impersonated-By $impersonated_by;
        proxy_set_header Authorization $http_authorization;
    }

    # Делегации
    location /api/v1/delegations/ {
        auth_request /auth-check;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        auth_request_set $impersonated_by $upstream_http_x_impersonated_by;

        proxy_pass http://delegation_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-ID $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Impersonated-By $impersonated_by;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/v1/delegation-rules/ {
        auth_request /auth-check;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        auth_request_set $impersonated_by $upstream_http_x_impersonated_by;

        proxy_pass http://delegation_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-ID $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Impersonated-By $impersonated_by;
        proxy_set_header Authorization $http_authorization;
    }

    # Уведомления
    location /api/v1/notifications {
        auth_request /auth-check;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        auth_request_set $impersonated_by $upstream_http_x_impersonated_by;

        proxy_pass http://notification_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-ID $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Impersonated-By $impersonated_by;
        proxy_set_header Authorization $http_authorization;

        # SSE — не буферизовать
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # UI Composer — страницы workflow
    location /page/ {
        auth_request /auth-check;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        auth_request_set $impersonated_by $upstream_http_x_impersonated_by;

        proxy_pass http://ui_composer_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-ID $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Impersonated-By $impersonated_by;
        proxy_set_header Authorization $http_authorization;
    }

    location /pages {
        auth_request /auth-check;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        auth_request_set $impersonated_by $upstream_http_x_impersonated_by;

        proxy_pass http://ui_composer_service/pages;
        proxy_set_header Host $host;
        proxy_set_header X-User-ID $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Impersonated-By $impersonated_by;
        proxy_set_header Authorization $http_authorization;
    }

    location /workflow/ {
        auth_request /auth-check;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        auth_request_set $impersonated_by $upstream_http_x_impersonated_by;

        proxy_pass http://ui_composer_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-ID $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Impersonated-By $impersonated_by;
        proxy_set_header Authorization $http_authorization;
    }

    # Защищённые /api/v1/* (пользователи, HR, admin)
    location /api/v1/ {
        auth_request /auth-check;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        auth_request_set $impersonated_by $upstream_http_x_impersonated_by;

        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-ID $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header X-Impersonated-By $impersonated_by;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        return 200 "API Gateway is running on port 8080\n";
        add_header Content-Type text/plain;
    }
}
