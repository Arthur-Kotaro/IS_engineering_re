name: hr_create_user
endpoint: /page/hr/create-user
title: "Создание пользователя"

sources:
  - id: departments
    service: user_service
    endpoint: /api/v1/hr/departments
    method: GET
  - id: positions
    service: user_service
    endpoint: /api/v1/hr/positions
    method: GET
  - id: roles
    service: user_service
    endpoint: /api/v1/hr/roles
    method: GET

ui:
  widgets:
    - type: Form
      id: create_user_form
      title: "Новый пользователь"
      submit_endpoint: /api/v1/hr/users
      submit_method: POST
      fields:
        - type: TextField
          field: user_name
          label: "Логин"
          required: true
        - type: TextField
          field: last_name
          label: "Фамилия"
          required: true
        - type: TextField
          field: first_name
          label: "Имя"
          required: true
        - type: TextField
          field: middle_name
          label: "Отчество"
        - type: EmailField
          field: email
          label: "Email"
          required: true
        - type: PasswordField
          field: password
          label: "Пароль"
          required: true
        - type: SelectField
          field: dept_id
          label: "Отдел"
          source: departments
          value_field: dept_id
          label_field: dept_name_ru
        - type: SelectField
          field: position_id
          label: "Должность"
          source: positions
          value_field: position_id
          label_field: position_name_ru
          required: true
        - type: MultiSelectField
          field: role_ids
          label: "Роли"
          source: roles
          value_field: role_id
          label_field: role_name_ru
        - type: TextField
          field: phone_work
          label: "Рабочий телефон"
        - type: TextField
          field: phone_mobile
          label: "Мобильный телефон"
