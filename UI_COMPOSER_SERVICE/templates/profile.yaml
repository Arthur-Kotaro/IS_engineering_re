name: profile
endpoint: /page/profile
title: "Мой профиль"
description: "Профиль пользователя"

sources:
  - id: user
    service: user_service
    endpoint: /api/v1/users/me
    method: GET

ui:
  widgets:
    - type: Card
      id: profile_card
      title: "Информация о пользователе"
      data:
        source: inline
        fields:
          - label: "ID"
            value: "{{user.user_id}}"
          - label: "Имя"
            value: "{{user.full_name}}"
          - label: "Email"
            value: "{{user.email}}"
          - label: "Роль"
            value: "{{user.roles | join(', ')}}"
          - label: "Статус"
            value: "{{user.status}}"
            type: badge

    - type: ProgressBar
      id: password_indicator
      data:
        source: endpoint
        url: /api/v1/auth/password-expiry
        method: GET
        value_path: days_remaining
        max: 90
        label: "Дней до истечения пароля"

    - type: Button
      id: change_password_btn
      text: "Сменить пароль"
      action:
        endpoint: /api/v1/users/me/change-password
        method: POST
        form:
          fields:
            - type: PasswordField
              field: current_password
              label: "Текущий пароль"
            - type: PasswordField
              field: new_password
              label: "Новый пароль"
            - type: PasswordField
              field: confirm_password
              label: "Подтверждение пароля"
