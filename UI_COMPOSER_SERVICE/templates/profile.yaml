name: profile
endpoint: /page/profile
title: "Мой профиль"
description: "Профиль пользователя"

sources:
  - id: user
    service: user_service
    endpoint: /api/v1/users/me
    method: GET

ui:
  widgets:
    - type: Card
      id: profile_card
      title: "Информация о пользователе"
      data:
        source: inline
        fields:
          - label: "ID"
            value: "{{user.user_id}}"
          - label: "Имя"
            value: "{{user.full_name}}"
          - label: "Email"
            value: "{{user.email}}"
          - label: "Роль"
            value: "{{user.roles}}"
          - label: "Статус"
            value: "{{user.status}}"
            type: badge
